version: '3.8'

services:
  redis:
    image: redis:7.0-alpine
    container_name: service-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    # ← this is the key bit:
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD}"

volumes:
  redis_data:
    name: ${REDIS_VOLUME}
    driver: local
