version: '3.8'
services:
  session-service:
    build:
      context: ../../../../
      dockerfile: services/service-session/Dockerfile.development
    ports:
      - "${SERVICE_SESSION_PORT}:5001"
    volumes:
      - ../../src:/app/src
      - session_node_modules:/app/node_modules
    env_file:
      - ../../.env.development
    command: yarn dev
    depends_on:
      - redis
      - kafka
      - postgres


volumes:
  session_node_modules:

